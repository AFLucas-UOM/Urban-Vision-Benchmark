dataset:
  annotations_root: Datasets/MTSD/Annotations
  prepared_root: Datasets/MTSD/Prepared
  version_base: mtsd-qa-v1
annotations:
  source_mode: qa_only
  group_scope: explicit
  approved_groups: [GRP-1, GRP-2, GRP-3, GRP-4, GRP-5, GRP-6, GRP-7, GRP-8, GRP-9, GRP-10, GRP-11]
  unexpected_group_policy: fail
  allow_raw_xml_fallback: false
  require_non_qa_confirmation: true
  qa_gate_file: Scripts/MTSD-Scripts/MTSD-SupervisedDetection/config/qa_gate.yaml
split:
  algorithm_version: v1
  ratios: {train: 0.80, valid: 0.10, test: 0.10}
  seed: 42
augmentation:
  recipe_version: photometric-v1+motion-blur-v1
  copies_per_image: 3
  seed: 42
  ops:
    brightness: {min: 0.8, max: 1.2}
    contrast: {min: 0.85, max: 1.15}
    color: {min: 0.9, max: 1.1}
    gaussian_blur: {p: 0.5, sigma_max: 1.0}
    gaussian_noise: {p: 0.3, sigma_max: 0.02}
    jpeg_compression: {p: 0.3, quality_min: 70, quality_max: 92}
    gamma: {min: 0.9, max: 1.1}
    motion_blur: {copy_index: 3, direction: horizontal, kernel_size: 9, blur_weight: 0.85}
strong_augmentation:
  recipe_version: strong-offline-v2
  copies_per_image: 3
  seed: 42
  output:
    jpeg_quality: 92
    workers: 8
    max_long_edge: 1920
  photometric:
    brightness: {min: 0.65, max: 1.35, probability: 0.75}
    contrast: {min: 0.70, max: 1.30, probability: 0.75}
    saturation_or_color: {min: 0.80, max: 1.20, probability: 0.70}
    gamma: {min: 0.70, max: 1.35, probability: 0.70}
    gaussian_blur: {probability: 0.50, sigma_max: 1.5}
    gaussian_noise: {probability: 0.50, sigma_max: 0.04}
    jpeg_compression: {probability: 0.60, quality_min: 45, quality_max: 90}
    motion_blur: {probability: 0.35, kernel_sizes: [7, 9, 11]}
    illumination:
      partial_shadow_probability: 0.25
      gradient_probability: 0.25
      local_change_probability: 0.20
      haze_probability: 0.15
  geometric:
    translation_fraction: 0.10
    scale_range: [0.75, 1.30]
    rotation_degrees: [-5.0, 5.0]
    shear_degrees: 2.0
    mild_perspective: {enabled: true, distortion_fraction: 0.02}
    random_crop: {enabled: true, probability: 0.35, min_retained_fraction: 0.85}
    photometric_probability: 0.65
    maximum_border_fraction: 0.18
    horizontal_flip:
      enabled: false
      probability: 0.0
      remap_validated: false
      direction_sensitive_class_ids: []
      class_remap: {}
  box_filter:
    visible_area_threshold: 0.35
    min_width_px: 2.0
    min_height_px: 2.0
    min_area_px: 9.0
  mosaic:
    probability: 0.40
    canvas_size: [1280, 1280]
    centre_range: [0.40, 0.60]
    photometric_probability: 0.35
    tiny_object_area_px: 16.0
    max_tiny_object_fraction: 0.70
  copy_paste:
    enabled: true
    probability: 0.20
    rare_class_max_instances: 700
    rare_class_frequency_quantile: 0.30
    maximum_paste_count: 2
    scale_range: [0.80, 1.25]
    maximum_sign_width_fraction: 0.20
    maximum_sign_height_fraction: 0.25
    context_fraction: 0.18
    edge_feather_fraction: 0.12
    maximum_iou: 0.20
    maximum_context_iou: 0.10
    placement_attempts: 30
    vertical_jitter_fraction: 0.15
    photometric_probability: 0.45
  mixup:
    enabled: false
    probability: 0.0
  rejection:
    maximum_attempts: 8
    reject_empty_samples: true
  visual_qa:
    samples_per_category: 8
training:
  epochs: 100
  image_size: 640
  effective_batch: 32
  ultralytics_optimizer_batch: 64
  ultralytics_physical_batch_by_image_size: {640: 32, 960: 16, 1280: 8}
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  patience: 10
  amp: true
  yolo_online_augmentation: disabled
  seed: 42
  deterministic: true
  device: auto
  per_model_overrides: {}
evaluation:
  excluded_categories: [Tourist Sign]
  common_f1_iou: 0.50
matrix:
  dissertation: [yolo12n, yolo12s, yolo12m, yolo26n, yolo26s, yolo26m, yolo11n, yolo11s, yolo11m, rfdetr-n, rfdetr-s, rfdetr-m, yolo26l]
  aug_ablation: [yolo11m, yolo12m, yolo26m]
  aug_ablation_optional: [yolo26l]
validation:
  require_all_classes_in_test: false
  minimum_boxes_per_class: {train: 1, valid: 0, test: 0}
  low_support_warning_threshold: 3
wandb:
  project: MSc-MTSD-SupervisedDetection
  entity_env: WANDB_ENTITY
  mode: online
  group: dissertation-augmented-v1
  log_interval_steps: 100
  log_dataset_artifact: true
outputs:
  runs_root: Results/MTSD-Runs
  results_root: Results/MTSD-Results
  state_root: Results/MTSD-Runs/Supervised-Matrix
