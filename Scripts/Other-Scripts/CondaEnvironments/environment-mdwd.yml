# ============================================================
# MDWD — Maltese Domestic Waste Dataset environment
# ============================================================
# YOLO detection (ultralytics), VLM experiments (transformers 4.57.x),
# and the notebook-based annotation/analysis tooling for the MDWD work.
#
# Create:   see Scripts/Other-Scripts/CondaEnvironments/README.md (per-platform scripts)
# PyTorch is NOT listed here on purpose — the correct build (CUDA 13.0 /
# CUDA 12.8 / CPU / macOS) is platform-specific and installed by the
# setup scripts after env creation.
#
# Pins mirror the working env on the primary Windows machine (2026-07-03).
# That env ran a torch 2.10 nightly (cu130); the scripts install the
# closest stable build instead.
# ============================================================
name: MDWD
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # ---- Detection / annotation tooling ----
      - ultralytics==8.4.60
      - supervision==0.27.0.post2
      - opencv-python==4.10.0.84
      - opencv-contrib-python==4.10.0.84
      # ---- Hugging Face stack (VLM experiments) ----
      - transformers==4.57.6
      - accelerate==1.11.0
      - huggingface_hub==0.36.2
      - safetensors==0.6.2
      - timm==1.0.22
      - peft==0.18.1
      - sentencepiece==0.2.1
      - "bitsandbytes==0.47.0; sys_platform != 'darwin'"
      # ---- Video / image decoding ----
      - av==14.2.0
      - "decord==0.6.0; sys_platform != 'darwin' or platform_machine != 'arm64'"
      - "eva-decord==0.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'"
      # ---- Numerics / plotting ----
      - numpy==1.26.4
      - pandas==2.3.3
      - pyarrow==23.0.0
      - scikit-learn==1.7.1
      - scipy==1.16.0
      - matplotlib==3.10.6
      - seaborn==0.13.2
      - pillow==11.1.0
      - einops==0.8.1
      # ---- Experiment tracking / config ----
      - wandb==0.27.0
      - python-dotenv==1.0.1
      - pyyaml==6.0.2
      - tqdm==4.67.1
      # ---- Notebooks ----
      - jupyterlab==4.4.7
      - notebook==7.4.5
      - ipykernel==6.30.1
      - jupyter_bbox_widget==0.6.0
